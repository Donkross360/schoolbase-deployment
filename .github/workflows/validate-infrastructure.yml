name: Validate shared infrastructure

on:
  push:
    branches: [main]
    paths:
      - compose.infrastructure.yml
      - Dockerfile.infrastructure-postgres
      - Dockerfile.infrastructure-minio
      - .dockerignore
      - scripts/provision-postgres.sh
      - scripts/provision-minio.sh
      - scripts/prepare-database-import.sh
      - scripts/restore-postgres.sh
      - .github/workflows/validate-infrastructure.yml
  pull_request:
    paths:
      - compose.infrastructure.yml
      - Dockerfile.infrastructure-postgres
      - Dockerfile.infrastructure-minio
      - .dockerignore
      - scripts/provision-postgres.sh
      - scripts/provision-minio.sh
      - scripts/prepare-database-import.sh
      - scripts/restore-postgres.sh
      - .github/workflows/validate-infrastructure.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_ADMIN_USER: schoolbase_admin
      POSTGRES_ADMIN_PASSWORD: ci-postgres-admin-password
      DEMO_DB_PASSWORD: ci-demo-database-password
      STPAUL_DB_PASSWORD: ci-stpaul-database-password
      MINIO_ROOT_USER: schoolbase_minio_admin
      MINIO_ROOT_PASSWORD: ci-minio-root-password
      DEMO_MINIO_SECRET_KEY: ci-demo-minio-secret-key
      STPAUL_MINIO_SECRET_KEY: ci-stpaul-minio-secret-key
      RESTORE_MINIO_SECRET_KEY: ci-restore-minio-secret-key
      EXPECTED_TABLE_COUNT: 1
      MINIO_PUBLIC_URL: http://127.0.0.1:9000
    steps:
      - uses: actions/checkout@v5

      - name: Render Compose configuration
        run: docker compose -f compose.infrastructure.yml config --quiet

      - name: Start shared services
        run: |
          docker network create coolify
          docker compose -f compose.infrastructure.yml up -d --wait

      - name: Provision both schools twice
        run: |
          for school in demo stpaul demo stpaul; do
            docker compose -f compose.infrastructure.yml exec -T postgres \
              /bin/sh /opt/schoolbase/provision-postgres.sh "$school"
            docker compose -f compose.infrastructure.yml exec -T minio \
              /bin/sh /opt/schoolbase/provision-minio.sh "$school"
          done

      - name: Restore a private transfer and remove it
        run: |
          docker compose -f compose.infrastructure.yml exec -T postgres \
            createdb -U "$POSTGRES_ADMIN_USER" restore_source
          docker compose -f compose.infrastructure.yml exec -T postgres \
            psql -U "$POSTGRES_ADMIN_USER" -d restore_source \
              -c 'CREATE TABLE restore_probe (id integer PRIMARY KEY); INSERT INTO restore_probe VALUES (1);'
          docker compose -f compose.infrastructure.yml exec -T postgres \
            pg_dump -U "$POSTGRES_ADMIN_USER" restore_source \
            | gzip > /tmp/sb_demo.sql.gz
          docker compose -f compose.infrastructure.yml cp \
            /tmp/sb_demo.sql.gz minio:/tmp/sb_demo.sql.gz
          docker compose -f compose.infrastructure.yml exec -T minio \
            /bin/sh /opt/schoolbase/prepare-database-import.sh demo
          docker compose -f compose.infrastructure.yml exec -T minio /bin/sh -euc '
            mc alias set root http://127.0.0.1:9000 \
              "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null
            mc cp /tmp/sb_demo.sql.gz root/schoolbase-imports/sb_demo.sql.gz >/dev/null
          '
          docker compose -f compose.infrastructure.yml exec -T postgres \
            /bin/sh /opt/schoolbase/restore-postgres.sh demo
          docker compose -f compose.infrastructure.yml exec -T postgres \
            psql -U "$POSTGRES_ADMIN_USER" -d sb_demo -Atqc \
              'SELECT count(*) FROM restore_probe' | grep -qx 1
          if docker compose -f compose.infrastructure.yml exec -T minio /bin/sh -euc '
            mc alias set root http://127.0.0.1:9000 \
              "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null
            mc stat root/schoolbase-imports/sb_demo.sql.gz
          '; then
            echo 'Restore transfer was not deleted.' >&2
            exit 1
          fi

      - name: Verify database isolation
        run: |
          docker compose -f compose.infrastructure.yml exec -T \
            -e PGPASSWORD="$DEMO_DB_PASSWORD" postgres \
            psql -h 127.0.0.1 -U sb_demo_app -d sb_demo -c 'SELECT 1' >/dev/null
          if docker compose -f compose.infrastructure.yml exec -T \
            -e PGPASSWORD="$DEMO_DB_PASSWORD" postgres \
            psql -h 127.0.0.1 -U sb_demo_app -d sb_stpaul -c 'SELECT 1'; then
            echo 'Demo unexpectedly connected to the St Paul database.' >&2
            exit 1
          fi

      - name: Verify bucket write isolation
        run: |
          docker compose -f compose.infrastructure.yml exec -T minio /bin/sh -euc '
            mc alias set demo-check http://127.0.0.1:9000 \
              "$DEMO_MINIO_ACCESS_KEY" "$DEMO_MINIO_SECRET_KEY" >/dev/null
            printf test >/tmp/isolation-check
            mc cp /tmp/isolation-check demo-check/demo/isolation-check >/dev/null
            if mc cp /tmp/isolation-check demo-check/stpaul/isolation-check; then
              echo "Demo unexpectedly wrote to the St Paul bucket." >&2
              exit 1
            fi
            mc rm demo-check/demo/isolation-check >/dev/null
          '

      - name: Verify explicit credential rotation
        env:
          ROTATED_DB_PASSWORD: ci-rotated-demo-database-password
          ROTATED_MINIO_SECRET: ci-rotated-demo-minio-secret-key
        run: |
          docker compose -f compose.infrastructure.yml exec -T \
            -e DEMO_DB_PASSWORD="$ROTATED_DB_PASSWORD" postgres \
            /bin/sh /opt/schoolbase/provision-postgres.sh demo rotate
          if docker compose -f compose.infrastructure.yml exec -T \
            -e PGPASSWORD="$DEMO_DB_PASSWORD" postgres \
            psql -h 127.0.0.1 -U sb_demo_app -d sb_demo -c 'SELECT 1'; then
            echo 'Old Demo database password still works after rotation.' >&2
            exit 1
          fi
          docker compose -f compose.infrastructure.yml exec -T \
            -e PGPASSWORD="$ROTATED_DB_PASSWORD" postgres \
            psql -h 127.0.0.1 -U sb_demo_app -d sb_demo -c 'SELECT 1' >/dev/null

          docker compose -f compose.infrastructure.yml exec -T \
            -e DEMO_MINIO_SECRET_KEY="$ROTATED_MINIO_SECRET" minio \
            /bin/sh /opt/schoolbase/provision-minio.sh demo rotate
          if docker compose -f compose.infrastructure.yml exec -T minio /bin/sh -euc '
            mc alias set old-demo http://127.0.0.1:9000 \
              "$DEMO_MINIO_ACCESS_KEY" "$DEMO_MINIO_SECRET_KEY" >/dev/null
            mc ls old-demo/demo
          '; then
            echo 'Old Demo MinIO secret still works after rotation.' >&2
            exit 1
          fi
          docker compose -f compose.infrastructure.yml exec -T \
            -e DEMO_MINIO_SECRET_KEY="$ROTATED_MINIO_SECRET" minio /bin/sh -euc '
              mc alias set rotated-demo http://127.0.0.1:9000 \
                "$DEMO_MINIO_ACCESS_KEY" "$DEMO_MINIO_SECRET_KEY" >/dev/null
              mc ls rotated-demo/demo >/dev/null
            '

      - name: Show service logs after failure
        if: failure()
        run: docker compose -f compose.infrastructure.yml logs

      - name: Remove test services
        if: always()
        run: docker compose -f compose.infrastructure.yml down --volumes
