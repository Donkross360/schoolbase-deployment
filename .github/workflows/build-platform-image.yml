name: Build SchoolBase platform images

on:
  workflow_dispatch:
    inputs:
      platform_ref:
        description: Private Platform mirror branch, tag, or full commit SHA
        required: true
        default: main
  workflow_call:

permissions:
  contents: read
  packages: write

concurrency:
  group: schoolbase-platform-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out private platform source
        if: github.repository != 'Donkross360/schoolbase-deployment'
        uses: actions/checkout@v5
        with:
          path: SchoolBase-Platform-BE
          persist-credentials: false

      - name: Require mirror read token
        if: github.repository == 'Donkross360/schoolbase-deployment'
        env:
          MIRROR_READ_TOKEN: ${{ secrets.PLATFORM_MIRROR_READ_TOKEN }}
        run: |
          if [ -z "$MIRROR_READ_TOKEN" ]; then
            echo 'Set PLATFORM_MIRROR_READ_TOKEN as a repository Actions secret before running this workflow.' >&2
            exit 1
          fi

      - name: Check out private Platform mirror
        if: github.repository == 'Donkross360/schoolbase-deployment'
        uses: actions/checkout@v5
        with:
          repository: Donkross360/SchoolBase-Platform-BE
          ref: ${{ inputs.platform_ref }}
          path: SchoolBase-Platform-BE
          token: ${{ secrets.PLATFORM_MIRROR_READ_TOKEN }}
          persist-credentials: false

      - name: Check out deployment smoke test
        if: github.repository != 'Donkross360/schoolbase-deployment'
        uses: actions/checkout@v5
        with:
          repository: Donkross360/schoolbase-deployment
          ref: ${{ job.workflow_sha }}
          path: schoolbase-deployment
          persist-credentials: false

      - name: Check out deployment smoke test from this repository
        if: github.repository == 'Donkross360/schoolbase-deployment'
        uses: actions/checkout@v5
        with:
          path: schoolbase-deployment
          persist-credentials: false

      - name: Resolve immutable image tags
        id: metadata
        shell: bash
        env:
          BUILD_REPOSITORY: ${{ github.repository }}
        run: |
          backend_sha=$(git -C SchoolBase-Platform-BE rev-parse HEAD)
          owner=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          if [ "$BUILD_REPOSITORY" = 'Donkross360/schoolbase-deployment' ]; then
            image="ghcr.io/${owner}/schoolbase"
            api_image="${image}:platform-api-be-${backend_sha:0:12}"
            collector_image="${image}:platform-collector-be-${backend_sha:0:12}"
          else
            api_image="ghcr.io/${owner}/schoolbase-platform-api:be-${backend_sha:0:12}"
            collector_image="ghcr.io/${owner}/schoolbase-platform-collector:be-${backend_sha:0:12}"
          fi
          {
            echo "backend_sha=$backend_sha"
            echo "api_image=$api_image"
            echo "collector_image=$collector_image"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API for smoke test
        uses: docker/build-push-action@v6
        with:
          context: ./SchoolBase-Platform-BE
          file: ./SchoolBase-Platform-BE/Dockerfile
          load: true
          tags: schoolbase-platform-api-smoke:${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build collector for smoke test
        uses: docker/build-push-action@v6
        with:
          context: ./SchoolBase-Platform-BE
          file: ./SchoolBase-Platform-BE/Dockerfile.collector
          load: true
          tags: schoolbase-platform-collector-smoke:${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image contents and runtime user
        run: |
          docker run --rm --entrypoint sh schoolbase-platform-api-smoke:${{ github.run_id }} -ec \
            'test -f dist/main.js; test -f scripts/migrate.js; test -f scripts/bootstrap-admin.js; test -d db; test "$(id -u)" != 0'
          docker run --rm --entrypoint sh schoolbase-platform-collector-smoke:${{ github.run_id }} -ec \
            'test -f scripts/collect-database-size.js; test -f scripts/collect-minio-bucket.js; test -f scripts/collect-disk-headroom.js; test "$(id -u)" != 0'

      - name: Smoke test API startup and migrations
        run: ./schoolbase-deployment/scripts/smoke-test-platform-image.sh schoolbase-platform-api-smoke:${{ github.run_id }}

      - name: Publish API image
        id: publish_api
        uses: docker/build-push-action@v6
        with:
          context: ./SchoolBase-Platform-BE
          file: ./SchoolBase-Platform-BE/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.api_image }}
          cache-from: type=gha
          provenance: true
          sbom: true

      - name: Publish collector image
        id: publish_collector
        uses: docker/build-push-action@v6
        with:
          context: ./SchoolBase-Platform-BE
          file: ./SchoolBase-Platform-BE/Dockerfile.collector
          push: true
          tags: ${{ steps.metadata.outputs.collector_image }}
          cache-from: type=gha
          provenance: true
          sbom: true

      - name: Pull published images by digest
        env:
          API_IMAGE: ${{ steps.metadata.outputs.api_image }}
          COLLECTOR_IMAGE: ${{ steps.metadata.outputs.collector_image }}
          API_DIGEST: ${{ steps.publish_api.outputs.digest }}
          COLLECTOR_DIGEST: ${{ steps.publish_collector.outputs.digest }}
        shell: bash
        run: |
          api_reference="${API_IMAGE%:*}@${API_DIGEST}"
          collector_reference="${COLLECTOR_IMAGE%:*}@${COLLECTOR_DIGEST}"
          docker pull "$api_reference"
          docker pull "$collector_reference"
          docker image inspect "$api_reference" "$collector_reference" >/dev/null

      - name: Publish Coolify image coordinates
        env:
          API_IMAGE: ${{ steps.metadata.outputs.api_image }}
          COLLECTOR_IMAGE: ${{ steps.metadata.outputs.collector_image }}
          API_DIGEST: ${{ steps.publish_api.outputs.digest }}
          COLLECTOR_DIGEST: ${{ steps.publish_collector.outputs.digest }}
          BACKEND_SHA: ${{ steps.metadata.outputs.backend_sha }}
        run: |
          api_repository=${API_IMAGE%:*}
          collector_repository=${COLLECTOR_IMAGE%:*}
          {
            echo '### SchoolBase platform images'
            echo '```text'
            echo "PLATFORM_API_IMAGE=$API_IMAGE"
            echo "PLATFORM_COLLECTOR_IMAGE=$COLLECTOR_IMAGE"
            echo "PLATFORM_API_DIGEST=${api_repository}@${API_DIGEST}"
            echo "PLATFORM_COLLECTOR_DIGEST=${collector_repository}@${COLLECTOR_DIGEST}"
            echo '```'
            echo "Platform backend: $BACKEND_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
