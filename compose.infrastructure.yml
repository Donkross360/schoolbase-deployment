services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.infrastructure-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?set POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      DEMO_DB_USER: ${DEMO_DB_USER:-sb_demo_app}
      DEMO_DB_PASSWORD: ${DEMO_DB_PASSWORD:?set DEMO_DB_PASSWORD}
      STPAUL_DB_USER: ${STPAUL_DB_USER:-sb_stpaul_app}
      STPAUL_DB_PASSWORD: ${STPAUL_DB_PASSWORD:?set STPAUL_DB_PASSWORD}
      RESTORE_MINIO_ACCESS_KEY: ${RESTORE_MINIO_ACCESS_KEY:-schoolbase_restore}
      RESTORE_MINIO_SECRET_KEY: ${RESTORE_MINIO_SECRET_KEY:?set RESTORE_MINIO_SECRET_KEY}
      EXPECTED_TABLE_COUNT: ${EXPECTED_TABLE_COUNT:-59}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      schoolbase_shared:
        aliases:
          - postgres
          - schoolbase-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 60s
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-2g}
    cpus: ${POSTGRES_CPU_LIMIT:-1.5}
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  minio:
    build:
      context: .
      dockerfile: Dockerfile.infrastructure-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    labels:
      traefik.docker.network: coolify
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      DEMO_MINIO_ACCESS_KEY: ${DEMO_MINIO_ACCESS_KEY:-sb_demo_app}
      DEMO_MINIO_SECRET_KEY: ${DEMO_MINIO_SECRET_KEY:?set DEMO_MINIO_SECRET_KEY}
      STPAUL_MINIO_ACCESS_KEY: ${STPAUL_MINIO_ACCESS_KEY:-sb_stpaul_app}
      STPAUL_MINIO_SECRET_KEY: ${STPAUL_MINIO_SECRET_KEY:?set STPAUL_MINIO_SECRET_KEY}
      MINIO_BUCKET_PUBLIC_READ: ${MINIO_BUCKET_PUBLIC_READ:-true}
      RESTORE_MINIO_ACCESS_KEY: ${RESTORE_MINIO_ACCESS_KEY:-schoolbase_restore}
      RESTORE_MINIO_SECRET_KEY: ${RESTORE_MINIO_SECRET_KEY:?set RESTORE_MINIO_SECRET_KEY}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-https://files.schoolbase.africa}
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data
    networks:
      schoolbase_shared:
        aliases:
          - minio
          - schoolbase-minio
      coolify: {}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 20s
    stop_grace_period: 30s
    mem_limit: ${MINIO_MEMORY_LIMIT:-1g}
    cpus: ${MINIO_CPU_LIMIT:-1.0}
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # CompreFace runs in this infrastructure stack, but uses its own database.
  compreface-postgres-db:
    image: exadel/compreface-postgres-db:${COMPREFACE_VERSION:-1.2.0}
    restart: unless-stopped
    environment:
      POSTGRES_USER: compreface
      POSTGRES_PASSWORD: ${COMPREFACE_DB_PASSWORD:?set COMPREFACE_DB_PASSWORD}
      POSTGRES_DB: frs
    volumes:
      - compreface_postgres_data:/var/lib/postgresql/data
    networks:
      - compreface_internal

  compreface-api:
    image: exadel/compreface-api:${COMPREFACE_VERSION:-1.2.0}
    restart: unless-stopped
    depends_on:
      - compreface-postgres-db
    environment:
      POSTGRES_USER: compreface
      POSTGRES_PASSWORD: ${COMPREFACE_DB_PASSWORD:?set COMPREFACE_DB_PASSWORD}
      POSTGRES_URL: jdbc:postgresql://compreface-postgres-db:5432/frs
      SPRING_PROFILES_ACTIVE: dev
      API_JAVA_OPTS: ${COMPREFACE_API_JAVA_OPTS:--Xmx4g}
      SAVE_IMAGES_TO_DB: "false"
      MAX_FILE_SIZE: 5MB
      MAX_REQUEST_SIZE: 10MB
      CONNECTION_TIMEOUT: "10000"
      READ_TIMEOUT: "60000"
    networks:
      - compreface_internal

  compreface-admin:
    image: exadel/compreface-admin:${COMPREFACE_VERSION:-1.2.0}
    restart: unless-stopped
    depends_on:
      - compreface-postgres-db
      - compreface-api
    environment:
      POSTGRES_USER: compreface
      POSTGRES_PASSWORD: ${COMPREFACE_DB_PASSWORD:?set COMPREFACE_DB_PASSWORD}
      POSTGRES_URL: jdbc:postgresql://compreface-postgres-db:5432/frs
      SPRING_PROFILES_ACTIVE: dev
      ENABLE_EMAIL_SERVER: "false"
      EMAIL_HOST: ""
      EMAIL_USERNAME: ""
      EMAIL_FROM: ""
      EMAIL_PASSWORD: ""
      ADMIN_JAVA_OPTS: ${COMPREFACE_ADMIN_JAVA_OPTS:--Xmx1g}
      MAX_FILE_SIZE: 5MB
      MAX_REQUEST_SIZE: 10MB
    networks:
      - compreface_internal

  compreface-core:
    image: exadel/compreface-core:${COMPREFACE_VERSION:-1.2.0}
    restart: unless-stopped
    environment:
      ML_PORT: "3000"
      IMG_LENGTH_LIMIT: "640"
      UWSGI_PROCESSES: "2"
      UWSGI_THREADS: "1"
    networks:
      - compreface_internal
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:3000/healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  compreface-fe:
    image: exadel/compreface-fe:${COMPREFACE_VERSION:-1.2.0}
    restart: unless-stopped
    labels:
      traefik.enable: "false"
    depends_on:
      - compreface-api
      - compreface-admin
    ports:
      - "127.0.0.1:${COMPREFACE_DASHBOARD_PORT:-18000}:80"
    environment:
      CLIENT_MAX_BODY_SIZE: 10M
      PROXY_READ_TIMEOUT: 60000ms
      PROXY_CONNECT_TIMEOUT: 10000ms
    networks:
      compreface_internal: {}
      schoolbase_shared:
        aliases:
          - schoolbase-compreface

volumes:
  postgres_data:
    name: schoolbase-postgres-data
  minio_data:
    name: schoolbase-minio-data
  compreface_postgres_data:
    name: schoolbase-compreface-postgres-data

networks:
  schoolbase_shared:
    name: schoolbase-shared
    driver: bridge
  coolify:
    external: true
  compreface_internal:
    internal: true
